<div class="card">
  <a [routerLink]="['/element', element()?.id]" class="card-image-link">
    <img [src]="element()?.img" [alt]="element()?.name" class="card-image" />
  </a>
  <h5>ID {{ element()?.id }}</h5>
  <a class="card-title-link">
    <h5 class="card-title">{{ element()?.name }}</h5>
  </a>
  <h5>Categoria {{ element()?.category }}</h5>
  <h5>Tipo {{ element()?.type }}</h5>
  <p class="card-text">
    {{ element()?.description }}
  </p>
  <p>Existencia: {{ element()?.quantity }}</p>
  <p class="entrydate">Fecha de Entrada: {{ date() }}</p>
  <a [routerLink]="['/element', element()?.id]" class="btn-secondary">
    Ver
    <svg
      class="btn-icon"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 12H5m14 0-4 4m4-4-4-4"
      />
    </svg>
  </a>
</div>
