<section class="full-body">
  <section class="newUser">
    <a (click)="Register()">Registrarse</a>
  </section>

  <form class="form-container">
    <section class="title">
      <h1>Bienvenido</h1>
      <hr />
    </section>
    <div class="form-group">
      <label for="text" class="form-label">Ingresar Usuario</label>
      <input
        type="text"
        [formControl]="userName"
        id="user"
        class="form-input"
        placeholder="nombre de usuario..."
        required
      />
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Ingresar Contraseña</label>
      <input
        type="password"
        [formControl]="userPassword"
        id="password"
        class="form-input"
        placeholder="••••••••"
        required
      />
    </div>

    <button (click)="GetAccess($event)" type="submit" class="btn-submit">Ingresar</button>
  </form>
</section>
